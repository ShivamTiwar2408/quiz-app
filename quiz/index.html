<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recall · pick a topic</title>
<style>
  :root{
    --bg:#0f1320; --bg2:#141a2b; --panel:#182033; --panel2:#1f2940;
    --ink:#e8eef7; --muted:#a6b4ca; --faint:#6f7f9a;
    --line:#2a3650; --accent:#5b9dff; --accent2:#9b7bff;
    --green:#46c98b; --red:#f0635c; --gold:#e0a93f;
    --radius:14px;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,system-ui,sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,monospace;
    --appbg:radial-gradient(900px 500px at 50% -10%,#1a2138 0%,var(--bg) 60%);
  }
  /* ---- Śrīmad Bhāgavatam: bright, warm, happy theme ---- */
  body.theme-bhagavatam{
    --bg:#fbf3e4; --bg2:#fff9ef; --panel:#fffdf8; --panel2:#fdf2dd;
    --ink:#3a2c17; --muted:#6e5a3c; --faint:#a98f63;
    --line:#ecdcbd; --accent:#e08a2c; --accent2:#d9633a;
    --green:#3a9d6a; --red:#d8584f; --gold:#c98a14;
    --appbg:radial-gradient(900px 460px at 50% -8%,#fff4dc 0%,#fbf3e4 55%);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--appbg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden;transition:background .4s ease}

  .app{display:grid;grid-template-columns:300px 1fr;height:100vh}
  aside,.card,.opt,select,.btn,.search input{transition:background .4s ease,border-color .4s ease,color .4s ease}

  /* ---------- sidebar tree ---------- */
  aside{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  aside .head{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
  aside .head .t{font-weight:800;font-size:16px;letter-spacing:.3px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  aside .head .s{font-size:11.5px;color:var(--faint);margin-top:2px}
  .search{margin:10px 16px 6px}
  .search input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 11px;font-size:13.5px}
  .search input::placeholder{color:var(--faint)}
  .tree{flex:1;overflow-y:auto;padding:6px 10px 24px;scrollbar-width:thin}
  .tree::-webkit-scrollbar{width:7px}.tree::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  .topic>.row{display:flex;align-items:center;gap:7px;padding:8px 9px;border-radius:8px;cursor:pointer;font-weight:650;font-size:14px;color:var(--ink);user-select:none}
  .topic>.row:hover{background:var(--panel)}
  .topic>.row .caret{transition:.18s;color:var(--faint);font-size:11px;width:12px;display:inline-block}
  .topic.open>.row .caret{transform:rotate(90deg)}
  .topic>.row .cnt{margin-left:auto;font-size:11px;color:var(--faint);font-family:var(--mono)}
  .kids{display:none;margin:2px 0 6px 6px;border-left:1px solid var(--line);padding-left:8px}
  .topic.open>.kids{display:block}
  .leaf{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--muted);transition:.12s}
  .leaf:hover{background:var(--panel);color:var(--ink)}
  .leaf.active{background:linear-gradient(90deg,rgba(91,157,255,.18),transparent);color:var(--ink);border-left:2px solid var(--accent);margin-left:-2px}
  .leaf .lc{margin-left:auto;font-size:10.5px;color:var(--faint);font-family:var(--mono)}
  .leaf .dot{flex:0 0 6px;height:6px;border-radius:50%;background:var(--line)}
  .leaf.active .dot{background:var(--accent)}

  /* ---------- main ---------- */
  main{overflow-y:auto;min-height:0;position:relative}
  .mwrap{max-width:760px;margin:0 auto;padding:30px 28px 80px}
  .mobile-bar{display:none}

  .empty{text-align:center;color:var(--muted);padding:80px 20px}
  .empty .big{font-size:42px;margin-bottom:12px}
  .empty h2{font-weight:700;font-size:22px;color:var(--ink);margin-bottom:6px}

  .card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin:16px 0}

  /* setup card */
  .crumb{font-size:12.5px;color:var(--faint);font-family:var(--mono);margin-bottom:6px}
  .setup h2{font-size:21px;font-weight:700;margin-bottom:4px}
  .setup p{color:var(--muted);font-size:14px;margin-bottom:14px}
  .controls{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  label.lw{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
  select{font-family:var(--sans);font-size:14px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:8px 12px;cursor:pointer}
  .btn{font-family:var(--sans);font-size:15px;font-weight:650;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:11px 18px;cursor:pointer;transition:.15s;white-space:nowrap}
  .btn:hover:not(:disabled){border-color:var(--accent)}
  .btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .row{display:flex;gap:10px;flex-wrap:wrap}

  /* progress + question */
  .qcount{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
  .qcount .score{color:var(--gold);font-weight:650}
  .pbar{height:7px;background:var(--panel2);border-radius:5px;overflow:hidden;margin-bottom:18px}
  .pbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .3s}
  .qtext{font-size:18px;font-weight:600;line-height:1.45;margin:4px 0 8px;color:var(--ink)}
  .multi-hint{font-size:12.5px;color:var(--gold);margin-bottom:12px;display:none}
  .multi-hint.show{display:block}
  .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--panel2);border:1.5px solid var(--line);color:var(--ink);padding:13px 15px;border-radius:11px;margin:9px 0;cursor:pointer;transition:.13s;font-size:15px;line-height:1.4}
  .opt:hover:not(.locked){border-color:var(--accent);transform:translateY(-1px)}
  .opt .k{flex:0 0 26px;height:26px;border-radius:7px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;text-transform:uppercase;color:var(--accent)}
  .opt.sel{border-color:var(--accent);background:rgba(91,157,255,.12)}
  .opt.sel .k{background:var(--accent);color:#fff;border-color:var(--accent)}
  .opt.locked{cursor:default}
  .opt.correct{border-color:var(--green);background:rgba(70,201,139,.15)}
  .opt.correct .k{background:var(--green);color:#04210f;border-color:var(--green)}
  .opt.wrong{border-color:var(--red);background:rgba(240,99,92,.14)}
  .opt.wrong .k{background:var(--red);color:#2a0707;border-color:var(--red)}
  .opt .mark{margin-left:auto;font-size:17px;align-self:center}
  .explain{margin-top:8px;border-left:3px solid var(--accent);background:rgba(91,157,255,.08);padding:12px 15px;border-radius:0 10px 10px 0;font-size:14px;color:var(--muted);display:none}
  .explain.show{display:block}
  .explain b{color:var(--ink)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}

  /* results */
  .results{text-align:center}
  .scorebig{font-size:50px;font-weight:800;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
  .scorelbl{color:var(--muted);font-size:14px}
  .pct{font-size:15px;color:var(--gold);font-weight:650}
  .verdict{font-size:18px;margin:10px 0 4px}
  .review{text-align:left;margin-top:22px}
  .review h3{font-size:13px;color:var(--faint);text-transform:uppercase;letter-spacing:1px;margin:18px 0 8px;font-weight:650}
  .ritem{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0;background:var(--panel)}
  .ritem .rq{font-weight:600;font-size:15px;margin-bottom:8px}
  .ritem .ra{font-size:13.5px;margin:3px 0}
  .ritem .ra .tag{display:inline-block;width:118px;color:var(--faint)}
  .ritem .ra.you.ok{color:var(--green)} .ritem .ra.you.no{color:var(--red)} .ritem .ra.sol{color:var(--green)}
  .ritem .rex{font-size:13px;color:var(--muted);margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:6px}
  .badge.ok{background:rgba(70,201,139,.2);color:var(--green)} .badge.no{background:rgba(240,99,92,.2);color:var(--red)}

  .hide{display:none!important}
  .scrim{display:none}

  @media(max-width:760px){
    .app{grid-template-columns:1fr}
    aside{position:fixed;inset:0 40% 0 0;z-index:30;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.5);right:auto;width:78%}
    aside.open{transform:none}
    .mobile-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg2);position:sticky;top:0;z-index:10}
    .mobile-bar .ham{font-size:20px;cursor:pointer}
    .mwrap{padding:18px 16px 70px}
    .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:25;display:none}
    .scrim.show{display:block}
  }
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="head">
      <div class="t">📚 Recall</div>
      <div class="s" id="libMeta">loading…</div>
    </div>
    <div class="search"><input id="search" placeholder="Filter topics…" autocomplete="off"></div>
    <div class="tree" id="tree"></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- MAIN -->
  <main>
    <div class="mobile-bar"><span class="ham" id="ham">☰</span><b>Quiz</b></div>
    <div class="mwrap">
      <!-- empty -->
      <div id="emptyView" class="empty">
        <div class="big">📖</div>
        <h2>Pick a topic to begin</h2>
        <p>Choose a subtopic from the tree on the left. Answer the questions, see your score, and read the explanation for each.</p>
      </div>

      <!-- setup -->
      <div id="setupView" class="card setup hide">
        <div class="crumb" id="setupCrumb"></div>
        <h2 id="setupName"></h2>
        <p id="setupDesc"></p>
        <div class="controls">
          <label class="lw">Questions:
            <select id="lenSelect"><option value="5">5</option><option value="10">10</option><option value="20">20</option><option value="0" selected>All</option></select>
          </label>
          <label class="lw"><input type="checkbox" id="shuffleChk" checked> Shuffle</label>
        </div>
        <div class="row" style="margin-top:16px"><button class="btn primary" id="startBtn">Start quiz →</button></div>
      </div>

      <!-- quiz -->
      <div id="quizView" class="card hide">
        <div class="qcount"><span id="qPos">Question 1</span><span class="score" id="qScore">Score: 0</span></div>
        <div class="pbar"><i id="pbar"></i></div>
        <div class="qtext" id="qText"></div>
        <div class="multi-hint" id="multiHint">⚑ Select all that apply, then press Check.</div>
        <div id="optWrap"></div>
        <div class="explain" id="explain"></div>
        <div class="nav">
          <button class="btn" id="quitBtn">Quit</button>
          <div style="display:flex;gap:10px">
            <button class="btn primary hide" id="checkBtn">Check</button>
            <button class="btn primary hide" id="nextBtn">Next →</button>
          </div>
        </div>
      </div>

      <!-- results -->
      <div id="resultsView" class="card results hide">
        <div class="scorelbl">You scored</div>
        <div class="scorebig" id="rScore">0 / 0</div>
        <div class="pct" id="rPct"></div>
        <div class="verdict" id="rVerdict"></div>
        <div class="row" style="justify-content:center;margin-top:14px">
          <button class="btn primary" id="retryBtn">Retry</button>
          <button class="btn" id="anotherBtn">Pick another</button>
        </div>
        <div class="review" id="review"></div>
      </div>
    </div>
  </main>
</div>

<script>
const $=id=>document.getElementById(id);
let MANIFEST=null, current=null; // current = {topicName, leaf:{name,set,count}}
let quiz=[], idx=0, score=0, selected=new Set(), locked=false, results=[];
const setCache={};

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function showMain(id){['emptyView','setupView','quizView','resultsView'].forEach(v=>$(v).classList.add('hide'));$(id).classList.remove('hide');}

async function init(){
  try{ MANIFEST=await (await fetch('data/manifest.json')).json(); }
  catch(e){ $('libMeta').textContent='failed to load'; return; }
  $('libMeta').textContent=`${MANIFEST.tree.length} topics · ${MANIFEST.total_questions.toLocaleString()} questions`;
  buildTree();
  window.addEventListener('hashchange', route);
  route();   // honor a deep link on first load
}

// ---- hash routing: #/<set-id> ----
function findBySet(setId){
  for(const topic of MANIFEST.tree){
    const leaf=topic.children.find(c=>c.set===setId);
    if(leaf) return {topic,leaf};
  }
  return null;
}
function route(){
  const m=(location.hash||'').match(/^#\/(.+)$/);
  if(!m){ // no route → empty/home state
    document.querySelectorAll('.leaf.active').forEach(x=>x.classList.remove('active'));
    applyTheme(''); current=null; showMain('emptyView'); return;
  }
  const hit=findBySet(decodeURIComponent(m[1]));
  if(!hit){ showMain('emptyView'); return; }
  // make sure the leaf is present in the DOM (search filter may have hidden it)
  if(!document.querySelector(`.leaf[data-set="${cssEsc(hit.leaf.set)}"]`)){ $('search').value=''; buildTree(); }
  activateLeaf(hit.topic, hit.leaf);
}
function cssEsc(s){ return (window.CSS&&CSS.escape)?CSS.escape(s):s.replace(/[^a-zA-Z0-9_-]/g,'\\$&'); }

function buildTree(filter=''){
  const tree=$('tree'); tree.innerHTML='';
  const f=filter.trim().toLowerCase();
  MANIFEST.tree.forEach((topic,ti)=>{
    const matchKids=topic.children.filter(c=>!f|| c.name.toLowerCase().includes(f)||topic.name.toLowerCase().includes(f));
    if(f && matchKids.length===0) return;
    const tEl=document.createElement('div'); tEl.className='topic'+(f?' open':'');
    const total=topic.children.reduce((s,c)=>s+c.count,0);
    const row=document.createElement('div'); row.className='row';
    row.innerHTML=`<span class="caret">▶</span><span class="tn">${topic.name}</span><span class="cnt">${total}</span>`;
    row.addEventListener('click',()=>{
      const wasOpen=tEl.classList.contains('open');
      document.querySelectorAll('.topic.open').forEach(t=>t.classList.remove('open'));
      if(!wasOpen) tEl.classList.add('open');   // accordion: only one open at a time
    });
    tEl.appendChild(row);
    const kids=document.createElement('div'); kids.className='kids';
    (f?matchKids:topic.children).forEach(leaf=>{
      const lEl=document.createElement('div'); lEl.className='leaf'; lEl.dataset.set=leaf.set;
      lEl.innerHTML=`<span class="dot"></span><span class="ln">${leaf.name}</span><span class="lc">${leaf.count}</span>`;
      lEl.addEventListener('click',()=>{ location.hash='#/'+encodeURIComponent(leaf.set); });
      kids.appendChild(lEl);
    });
    tEl.appendChild(kids);
    tree.appendChild(tEl);
  });
}

function applyTheme(topicName){
  const bhagavatam = /bh[aā]gavatam|śr[iī]mad/i.test(topicName||'');
  document.body.classList.toggle('theme-bhagavatam', bhagavatam);
}
function activateLeaf(topic,leaf){
  document.querySelectorAll('.leaf.active').forEach(x=>x.classList.remove('active'));
  const el=document.querySelector(`.leaf[data-set="${cssEsc(leaf.set)}"]`);
  if(el){
    el.classList.add('active');
    document.querySelectorAll('.topic.open').forEach(t=>t.classList.remove('open')); // accordion
    el.closest('.topic')?.classList.add('open');     // expand only the parent topic
    el.scrollIntoView({block:'nearest'});
  }
  applyTheme(topic.name);
  current={topicName:topic.name,leaf};
  $('setupCrumb').textContent=topic.name;
  $('setupName').textContent=leaf.name;
  $('setupDesc').textContent=`${leaf.count} question${leaf.count!==1?'s':''} available. Choose how many and begin.`;
  showMain('setupView');
  closeSidebar();
}

async function loadSet(sid){
  if(setCache[sid]) return setCache[sid];
  const d=await (await fetch(`data/sets/${sid}.json`)).json();
  setCache[sid]=d.questions; return d.questions;
}

async function start(){
  let qs=await loadSet(current.leaf.set);
  if($('shuffleChk').checked) qs=shuffle(qs);
  const n=+$('lenSelect').value; if(n>0) qs=qs.slice(0,n);
  quiz=qs; idx=0; score=0; results=[];
  showMain('quizView'); renderQ();
}

function renderQ(){
  locked=false; selected=new Set();
  const q=quiz[idx];
  const multi=q.correct.length>1;
  $('qPos').textContent=`Question ${idx+1} of ${quiz.length}`;
  $('qScore').textContent=`Score: ${score}`;
  $('pbar').style.width=(idx/quiz.length*100)+'%';
  $('qText').textContent=q.question;
  $('multiHint').className='multi-hint'+(multi?' show':'');
  $('explain').className='explain'; $('explain').innerHTML='';
  $('nextBtn').classList.add('hide');
  $('checkBtn').classList.toggle('hide',!multi);  // single-select auto-checks on click
  const wrap=$('optWrap'); wrap.innerHTML='';
  q.options.forEach(o=>{
    const b=document.createElement('button'); b.className='opt'; b.dataset.key=o.key;
    b.innerHTML=`<span class="k">${o.key}</span><span class="ot">${o.text}</span><span class="mark"></span>`;
    b.addEventListener('click',()=>onOpt(o.key,b,multi));
    wrap.appendChild(b);
  });
}

function onOpt(key,btn,multi){
  if(locked) return;
  if(multi){
    if(selected.has(key)){selected.delete(key);btn.classList.remove('sel');}
    else{selected.add(key);btn.classList.add('sel');}
  } else {
    selected=new Set([key]); grade();
  }
}

function grade(){
  locked=true;
  const q=quiz[idx];
  const correct=new Set(q.correct);
  const chosen=[...selected];
  const isRight = chosen.length===correct.size && chosen.every(k=>correct.has(k));
  if(isRight) score++;
  results.push({q,chosen:chosen.slice().sort(),correct:[...correct].sort(),isRight});
  [...$('optWrap').children].forEach(b=>{
    const k=b.dataset.key; b.classList.add('locked'); b.classList.remove('sel');
    if(correct.has(k)){b.classList.add('correct');b.querySelector('.mark').textContent='✓';}
    else if(selected.has(k)){b.classList.add('wrong');b.querySelector('.mark').textContent='✗';}
  });
  $('qScore').textContent=`Score: ${score}`;
  const ex=$('explain');
  ex.innerHTML=`<b>${isRight?'Correct!':'Not quite.'}</b> ${q.explanation||''}`;
  ex.classList.add('show');
  $('checkBtn').classList.add('hide');
  $('nextBtn').classList.remove('hide');
  $('nextBtn').textContent=(idx===quiz.length-1)?'See results →':'Next →';
}

function next(){ idx++; if(idx>=quiz.length) showResults(); else renderQ(); }

function showResults(){
  showMain('resultsView');
  const total=quiz.length, pct=Math.round(score/total*100);
  $('rScore').textContent=`${score} / ${total}`; $('rPct').textContent=`${pct}%`;
  let v='Keep practicing — review the explanations below. 📘';
  if(pct>=90)v='Outstanding! 🏆'; else if(pct>=70)v='Great work! 👏'; else if(pct>=50)v='Solid — a bit more review. 📖';
  $('rVerdict').textContent=v;
  const rv=$('review'); rv.innerHTML='<h3>Review &amp; explanations</h3>';
  results.forEach((r,i)=>{
    const m={}; r.q.options.forEach(o=>m[o.key]=o.text);
    const fmt=ks=>ks.map(k=>`${k.toUpperCase()}. ${m[k]||'—'}`).join('<br>');
    const div=document.createElement('div'); div.className='ritem';
    div.innerHTML=`<div class="rq">${i+1}. ${r.q.question}<span class="badge ${r.isRight?'ok':'no'}">${r.isRight?'correct':'wrong'}</span></div>
      <div class="ra you ${r.isRight?'ok':'no'}"><span class="tag">Your answer:</span> ${r.chosen.length?fmt(r.chosen):'—'}</div>
      ${r.isRight?'':`<div class="ra sol"><span class="tag">Correct answer:</span> ${fmt(r.correct)}</div>`}
      <div class="rex">${r.q.explanation||''}</div>`;
    rv.appendChild(div);
  });
  document.querySelector('main').scrollTo({top:0,behavior:'smooth'});
}

// sidebar mobile
function closeSidebar(){$('sidebar').classList.remove('open');$('scrim').classList.remove('show');}
$('ham').addEventListener('click',()=>{$('sidebar').classList.add('open');$('scrim').classList.add('show');});
$('scrim').addEventListener('click',closeSidebar);
$('search').addEventListener('input',e=>buildTree(e.target.value));
$('startBtn').addEventListener('click',start);
$('checkBtn').addEventListener('click',()=>{ if(selected.size) grade(); });
$('nextBtn').addEventListener('click',next);
$('quitBtn').addEventListener('click',()=>{ if(results.length) showResults(); else showMain('setupView'); });
$('retryBtn').addEventListener('click',start);
$('anotherBtn').addEventListener('click',()=>showMain(current?'setupView':'emptyView'));
init();
</script>
</body>
</html>
