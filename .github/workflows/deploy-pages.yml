name: Deploy GitHub Pages

# Auto-publishes the repository to GitHub Pages on every push to main.
# Static apps/guides served from the repo root:
#   - Landing page (hub):    /index.html
#   - Recall quiz:           /quiz/index.html
#   - Systems problems guide:/systems-problems-kb/index.html
#   - Frontend systems guide: /frontend-systems-kb/index.html
#   - vLLM guide:            /vllm-kb/guide/index.html
#   - AWS networking guide:  /aws-networking-kb/guide/index.html

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Allow this workflow to publish Pages, and avoid overlapping deploys.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the whole repo root (static files served as-is).
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
